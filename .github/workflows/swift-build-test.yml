name: Swift Build and Test

# 2026-05-27 — cost-reduction: dropped push triggers. This workflow
# overlaps with ci.yml (also runs Build + Test on macos-15); on
# every push we'd fire BOTH for the same job. PR trigger retained
# so it still gates merges; ci.yml carries the post-merge coverage.
on:
  pull_request:
    branches: [ main, develop, 'release/*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS build and test
  test-macos:
    name: Test on macOS
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2'

      - name: Print Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        continue-on-error: true
        run: |
          swift test --parallel -v \
            --skip Benchmark \
            --skip Stress \
            --skip Diagnostic \
            --skip Fuzz \
            --skip PerformanceTuning \
            --skip LargeBlock \
            --skip EndToEnd \
            --skip ClientServer
        timeout-minutes: 60

      - name: Build release
        run: swift build -c release -v
