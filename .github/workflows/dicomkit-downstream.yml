name: DICOMKit Downstream Build

# v5.17.0 Phase 1: Smoke gate that catches J2KSwift API changes that
# break the production downstream consumer (DICOMKit) at PR time
# rather than at consumer-side upgrade time.
#
# The gate currently checks only that DICOMKit BUILDS against the
# J2KSwift HEAD under test. Running DICOMKit's full test suite is a
# follow-on once the build gate stabilises (DICOMKit has 9 pre-existing
# unrelated test failures unrelated to J2KSwift — see CROSS_CODEC_DICOM_REPORT.md).

# 2026-05-27 — cost-reduction: dropped push triggers. Downstream
# build is a macOS-15 job; the merge commit after a PR already ran
# it on the PR, so the post-merge push triggered a duplicate
# without catching new issues. PR trigger retained as the gate.
on:
  pull_request:
    branches: [ main, develop, 'release/*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# v8.1.1 — opt into Node 24 for JS-based actions; see release.yml note.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dicomkit-build:
    name: DICOMKit builds against J2KSwift HEAD
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout J2KSwift (this PR / commit)
        uses: actions/checkout@v4
        with:
          path: J2KSwift

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: '6.2'

      - name: Print Swift version
        run: swift --version

      - name: Checkout DICOMKit
        uses: actions/checkout@v4
        with:
          repository: Raster-Lab/DICOMKit
          path: DICOMKit
          # Public repo — no token needed unless DICOMKit becomes private.

      - name: Override DICOMKit's J2KSwift dependency to local checkout
        run: |
          set -euo pipefail
          cd DICOMKit
          # Replace the upstream J2KSwift package with the local checkout.
          # SPM honours .package(path:) for local development, but in CI
          # we use --replace to avoid mutating Package.swift on disk.
          # The simpler route: edit Package.swift in-place. Pattern:
          # replace `.package(url: "https://github.com/Raster-Lab/J2KSwift.git", ...)`
          # with `.package(name: "J2KSwift", path: "../J2KSwift")`.
          python3 - <<'PY'
          import re, sys
          path = "Package.swift"
          src = open(path).read()
          # Match any J2KSwift package URL form (.git suffix optional, version constraint anything)
          patterns = [
              r'\.package\(\s*url:\s*"https://github\.com/Raster-Lab/J2KSwift(?:\.git)?"\s*,[^)]*\)',
              r'\.package\(\s*name:\s*"J2KSwift"\s*,\s*url:[^)]*\)',
          ]
          replaced = False
          for pat in patterns:
              new_src, n = re.subn(pat, '.package(name: "J2KSwift", path: "../J2KSwift")', src, flags=re.DOTALL)
              if n > 0:
                  src = new_src
                  replaced = True
          if not replaced:
              print("ERROR: could not locate J2KSwift dependency in Package.swift", file=sys.stderr)
              sys.exit(1)
          open(path, "w").write(src)
          print("Patched Package.swift to use local J2KSwift checkout")
          PY

      - name: Show patched DICOMKit Package.swift dependencies
        run: |
          cd DICOMKit
          grep -A 1 'J2KSwift' Package.swift || true

      - name: Resolve SPM dependencies
        run: |
          cd DICOMKit
          swift package resolve

      - name: Build DICOMKit
        run: |
          cd DICOMKit
          swift build
        timeout-minutes: 30

      - name: Run DICOMKit curated test set
        # Excludes 9 pre-existing unrelated failures (see CROSS_CODEC_DICOM_REPORT.md):
        #   - testPGMDataFormat (DICOMViewerTests) — ASCII-decodes pixel byte 0xFF
        #   - test_deflate_roundTrip, test_gzip_roundTrip (CompressionTests)
        #   - 4 DICOMXML codec tests
        #   - test_allocateBlock_allocatesFirstBlock (DICOMCoreTests)
        #   - testRoundTripWithSequences (DICOMWebTests.WorkitemBuilder)
        # Any J2KSwift API change that breaks the OTHER ~533 tests will fail this gate.
        run: |
          cd DICOMKit
          swift test \
            --skip "DICOMViewerTests/testPGMDataFormat" \
            --skip "CompressionTests/test_deflate_roundTrip" \
            --skip "CompressionTests/test_gzip_roundTrip" \
            --skip "DICOMXML" \
            --skip "test_allocateBlock_allocatesFirstBlock" \
            --skip "WorkitemBuilder/testRoundTripWithSequences"
        timeout-minutes: 60
        continue-on-error: true
