name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.1.0)'
        required: true

permissions:
  contents: write

# v8.1.1 — opt into Node 24 for all JavaScript-based actions per
# GitHub's deprecation guidance (Node 20 forced-default 2026-06-02,
# fully removed 2026-09-16). Both `actions/checkout@v4` and
# `softprops/action-gh-release@v2` ship Node 20 binaries; this env
# var instructs the runner to execute them under Node 24 instead,
# eliminating the deprecation warnings without changing action
# pin versions. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Note: a `validate` job that ran `swift build -c release` was removed in
  # v6.0.1 because Package.swift then declared a sibling-path dependency on
  # `../CompressionFamily`, which no runner could resolve.
  #
  # That reason is obsolete. Package.swift declares no external dependency
  # at all: the CompressionFamily conformances moved to the separate package
  # under Adapters/J2KCompressionFamily (suite contract 0.8.0 §4), so
  # `swift package resolve` has nothing to fetch. Build verification now lives in ci.yml, which
  # builds debug and release on both Linux and macOS, so this workflow
  # deliberately stays a release-publishing workflow only. The mandatory
  # local commit gate in RELEASING.md is unchanged and remains stricter.

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        id: release_notes
        run: |
          # Try to find matching release notes file
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NUM="${VERSION#v}"

          if [ -f "RELEASE_NOTES_v${VERSION_NUM}.md" ]; then
            echo "notes_file=RELEASE_NOTES_v${VERSION_NUM}.md" >> $GITHUB_OUTPUT
          elif [ -f "RELEASE_NOTES.md" ]; then
            echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.release_notes.outputs.notes_file == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-branch:
    name: Create Release Branch
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release branch
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="release/${TAG}"

          # Check if branch already exists
          if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
            echo "Branch ${BRANCH} already exists, skipping creation"
          else
            git checkout -b "${BRANCH}" "${TAG}"
            git push origin "${BRANCH}"
            echo "Created branch ${BRANCH} from tag ${TAG}"
          fi
