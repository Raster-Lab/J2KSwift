name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # Note: a `validate` job that ran `swift build -c release` was removed in
  # v6.0.1. The build cannot succeed in CI because Package.swift declares a
  # sibling-path dependency on `../CompressionFamily`, which is a private
  # local package not present on any remote. The mandatory pre-release
  # commit gate (run locally on every release per RELEASING.md) is stricter
  # than `swift build -c release` and serves the same purpose.
  #
  # If `CompressionFamily` is ever pushed to a private GitHub repo, restore
  # the validate job here and add a sibling-checkout step using a deploy
  # key. See RELEASING.md "CI workflows that affect releases" for the exact
  # YAML to drop in.

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract release notes
        id: release_notes
        run: |
          # Try to find matching release notes file
          VERSION="${{ steps.version.outputs.tag }}"
          VERSION_NUM="${VERSION#v}"

          if [ -f "RELEASE_NOTES_v${VERSION_NUM}.md" ]; then
            echo "notes_file=RELEASE_NOTES_v${VERSION_NUM}.md" >> $GITHUB_OUTPUT
          elif [ -f "RELEASE_NOTES.md" ]; then
            echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.release_notes.outputs.notes_file == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-branch:
    name: Create Release Branch
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create release branch
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="release/${TAG}"

          # Check if branch already exists
          if git ls-remote --heads origin "${BRANCH}" | grep -q "${BRANCH}"; then
            echo "Branch ${BRANCH} already exists, skipping creation"
          else
            git checkout -b "${BRANCH}" "${TAG}"
            git push origin "${BRANCH}"
            echo "Created branch ${BRANCH} from tag ${TAG}"
          fi
